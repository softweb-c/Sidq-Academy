<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidq Academy | Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#D1D5DB] flex items-center justify-center min-h-screen">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
    <div class="text-center mb-6"><h1 class="text-3xl font-bold text-[#2563EB]">Join Sidq Academy</h1><p class="text-gray-500">Create account</p></div>
    <form id="registerForm" class="space-y-4">
      <input type="email" id="regEmail" placeholder="Email" class="w-full p-3 border rounded-xl" required>
      <input type="password" id="regPassword" placeholder="Password" class="w-full p-3 border rounded-xl" required>
      <button type="submit" class="w-full bg-[#2563EB] text-white py-3 rounded-xl font-semibold">Sign Up</button>
    </form>
    <p class="text-center mt-6 text-sm">Already have an account? <a href="/login.html" class="text-[#2563EB] font-semibold">Login</a></p>
  </div>
  <div id="toastContainer" class="fixed bottom-5 right-5"></div>
  <script src="/js/components.js"></script>
  <script src="/js/mockApi.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
