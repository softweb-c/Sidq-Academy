<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidq Academy | Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    input { transition: all 0.2s ease-in-out; font-size: 16px !important; } /* Prevent iOS zoom */
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 p-4 pb-20">
  
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-6 border border-white/50 relative overflow-hidden">

    <div class="text-center mb-6 relative z-10">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-100 rounded-2xl mb-3 text-blue-600">
        <i class="fas fa-graduation-cap text-3xl"></i>
      </div>
      <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Sidq Academy</h1>
      <p class="text-gray-500 text-sm mt-1">Welcome back! Sign in to continue</p>
    </div>

    <form id="loginForm" class="space-y-4 relative z-10">
      <div class="relative group">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <i class="fas fa-envelope text-gray-400 group-focus-within:text-blue-500 transition-colors"></i>
        </div>
        <input type="email" id="loginEmail" placeholder="Email address" required
               class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:bg-white">
      </div>

      <!-- UPDATED PASSWORD FIELD WITH TOGGLE -->
      <div class="relative group">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <i class="fas fa-lock text-gray-400 group-focus-within:text-blue-500 transition-colors"></i>
        </div>
        <input type="password" id="loginPassword" placeholder="Password" required
               class="w-full pl-11 pr-11 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:bg-white">
        <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-blue-600 transition-colors focus:outline-none">
          <i class="fas fa-eye" id="eyeIcon"></i>
        </button>
      </div>

      <div class="flex justify-end">
        <a href="#" class="text-sm font-medium text-blue-600 hover:text-blue-800 hover:underline transition-colors">Forgot password?</a>
      </div>

      <button type="submit" id="loginBtn" class="w-full bg-[#2563EB] text-white py-3 rounded-xl font-semibold shadow-lg shadow-blue-500/30 hover:shadow-blue-500/50 hover:-translate-y-0.5 transition-all duration-200 active:scale-95">
        <i class="fas fa-arrow-right-to-bracket mr-2"></i> Login
      </button>
    </form>

    <div class="relative my-4 z-10">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-gray-200"></div>
      </div>
      <div class="relative flex justify-center text-sm">
        <span class="px-4 bg-white text-gray-400">or</span>
      </div>
    </div>

    <p class="text-center text-sm text-gray-600 z-10 relative">
      Don't have an account? 
      <a href="/register.html" class="text-[#2563EB] font-semibold hover:text-blue-700 hover:underline transition-colors">Sign up for free</a>
    </p>
  </div>

  <div id="toastContainer" class="fixed bottom-5 right-5 z-50"></div>

  <!-- Your existing scripts -->
  <script src="/js/components.js"></script>
  <script src="/js/mockApi.js"></script>
  <script src="/js/auth.js"></script>

  <!-- New Password Toggle Script -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const togglePassword = document.querySelector('#togglePassword');
      const passwordInput = document.querySelector('#loginPassword');
      const eyeIcon = document.querySelector('#eyeIcon');

      if (togglePassword && passwordInput && eyeIcon) {
        togglePassword.addEventListener('click', function (e) {
          const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordInput.setAttribute('type', type);
          eyeIcon.classList.toggle('fa-eye');
          eyeIcon.classList.toggle('fa-eye-slash');
        });
      }
    });
  </script>
</body>
</html>
