<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidq Academy | Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#D1D5DB] flex items-center justify-center min-h-screen">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
    <div class="text-center mb-6"><h1 class="text-3xl font-bold text-[#2563EB]">Sidq Academy</h1><p class="text-gray-500">Sign in to continue</p></div>
    <form id="loginForm" class="space-y-4">
      <input type="email" id="loginEmail" placeholder="Email address" class="w-full p-3 border rounded-xl" required>
      <input type="password" id="loginPassword" placeholder="Password" class="w-full p-3 border rounded-xl" required>
      <button type="submit" class="w-full bg-[#2563EB] text-white py-3 rounded-xl font-semibold hover:bg-blue-700">Login</button>
    </form>
    <div class="mt-6 flex gap-3"><button id="demoAdminBtn" class="flex-1 bg-gray-200 py-2 rounded-lg text-sm">Demo Admin</button><button id="demoUserBtn" class="flex-1 bg-gray-200 py-2 rounded-lg text-sm">Demo User</button></div>
    <p class="text-center mt-6 text-sm">No account? <a href="/register.html" class="text-[#2563EB] font-semibold">Sign up</a></p>
  </div>
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50"></div>
  <script src="/js/components.js"></script>
  <script src="/js/mockApi.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
